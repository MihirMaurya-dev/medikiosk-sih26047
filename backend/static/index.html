<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKiosk - ABHA Login (Module D)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans">
    
    <!-- Official Header -->
    <header class="bg-white border-b-4 border-orange-500 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-green-600 rounded-full flex items-center justify-center">
                    <span class="text-white font-bold text-xl">🌿</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Ministry of Ayush</h1>
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Government of India</p>
                </div>
            </div>
            <div class="hidden sm:block text-right">
                <p class="text-sm font-bold text-blue-900">Ayushman Bharat Digital Mission</p>
                <p class="text-xs text-gray-500">Patient Case-Taking Software (SIH26047)</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100 relative overflow-hidden">
            <!-- Decorative accent -->
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-400 via-white to-green-500"></div>
            
            <div class="text-center mb-8 mt-2">
                <h2 class="text-2xl font-extrabold text-gray-900">MediKiosk Login</h2>
                <p class="text-gray-500 mt-2 text-sm">Please authenticate using your ABHA ID to begin your clinical intake.</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 flex justify-between" for="abha-id">
                        <span>ABHA Number</span>
                        <span class="text-blue-600 font-normal text-xs cursor-pointer hover:underline">Don't have one?</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
                        </span>
                        <input type="text" id="abha-id" placeholder="12-3456-7890-1234" required pattern="\d{2}-?\d{4}-?\d{4}-?\d{4}"
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-lg tracking-widest font-mono text-gray-800 transition-all shadow-sm">
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="flex items-start space-x-3 cursor-pointer">
                        <input type="checkbox" id="consent" required class="mt-1 h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <span class="text-xs text-gray-600 leading-relaxed">
                            <strong>Digital Consent (DPDP Act):</strong> I hereby authorize MediKiosk to securely record my medical history and share it with my healthcare provider via the ABDM network.
                        </span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md hover:shadow-lg text-lg flex items-center justify-center group">
                    <span>Authenticate</span>
                    <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </main>
    
    <footer class="bg-gray-800 text-gray-400 py-4 text-center text-xs">
        <p>Built for Smart India Hackathon 2026 | Problem Statement: SIH26047</p>
    </footer>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const abhaInput = document.getElementById('abha-id').value;
            const consent = document.getElementById('consent').checked;
            
            // Strip out the dashes to check exactly 14 digits
            const pureDigits = abhaInput.replace(/\D/g, '');
            
            if (pureDigits.length !== 14) {
                alert("Please enter a valid 14-digit ABHA ID.");
                return;
            }

            if (consent) {
                // Save mock patient data to session
                localStorage.setItem('patient_abha', abhaInput);
                localStorage.setItem('medikiosk_history', '[]'); // reset chat
                
                // Redirect to Module A
                window.location.href = '/chat';
            }
        });
        
        // Auto-format ABHA ID
        document.getElementById('abha-id').addEventListener('input', function (e) {
            let target = e.target;
            let val = target.value.replace(/\D/g, '');
            if (val.length > 2 && val.length <= 6) val = val.replace(/(\d{2})/, '$1-');
            else if (val.length > 6 && val.length <= 10) val = val.replace(/(\d{2})(\d{4})/, '$1-$2-');
            else if (val.length > 10) val = val.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3-');
            target.value = val;
        });
    </script>
</body>
</html>
